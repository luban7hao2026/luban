server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads up to the backend's 8 MB image limit (plus multipart overhead).
    client_max_body_size 10m;

    # Same-origin API proxy: /api/* -> FastAPI container, stripping the /api prefix.
    #   /api/auth/login      -> backend:8000/auth/login
    #   /api/uploads/x.jpg   -> backend:8000/uploads/x.jpg
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side path routing keeps working on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
